name: CI

on:
  push:
    branches: [main, 'docs/**', 'feat/**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Flutter is pinned to an exact version so CI cannot drift when the
      # `stable` channel moves forward. This is deliberate: the local pin lives
      # in `.puro.json`, but `puro use` adds that file to `.git/info/exclude`,
      # which is local-only and never committed — so CI is the authoritative pin.
      #
      # Keep this in sync with the local environment when it is upgraded.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Yellow-flag standard: analyze must be fully clean, with the
      # very_good_analysis ruleset at full strength. Do not add ignores here.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
