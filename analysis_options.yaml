# Yellow-flag standard: very_good_analysis runs at full strength.
#
# Do NOT silence a rule to reach a green `flutter analyze`. Fix the code instead.
# If a rule must be disabled, it needs a written reason and a project-owner decision.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # Treat these as build-breaking rather than cosmetic, because they hide real
    # defects: a missing return, an unused import, a dead value.
    unused_import: error
    unused_local_variable: error
    dead_code: error
    missing_required_param: error
    missing_return: error

  exclude:
    # Generated by build_runner (drift, freezed, json_serializable).
    # Never lint generated code: fixing it is impossible and it is not ours.
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.gr.dart"
    - build/**
    - android/**

linter:
  rules:
    # Public API members in this app are small and self-documenting; requiring
    # dartdoc on every one would add noise, not clarity. This is a deliberate,
    # narrow exception — not a blanket relaxation.
    public_member_api_docs: false
